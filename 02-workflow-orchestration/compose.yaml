name: zoomcamp-module2
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: kestra
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 3s
      timeout: 5s
      retries: 30
  kestra:
    build: ./code
    command: server standalone
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m"
      DATABASE_URL: postgresql://kestra:local-only-password@postgres:5432/kestra
      TAXI_DATA_DIR: /data
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: local-only-password
        kestra:
          server:
            basicAuth:
              username: "admin@local.test"
              password: "LocalZoomcamp123!"
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8082/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    volumes:
      - kestra:/app/storage
      - work:/tmp/kestra-wd
      - data:/data
      - ./code:/opt/module:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:
  kestra:
  work:
  data:
