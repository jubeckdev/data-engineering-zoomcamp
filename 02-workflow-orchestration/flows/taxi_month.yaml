id: taxi_month
namespace: zoomcamp.module2
description: Load a course taxi CSV into an atomic raw PostgreSQL month table.
inputs:
  - id: taxi
    type: SELECT
    values: [green, yellow]
    defaults: green
  - id: year
    type: SELECT
    values: ["2019", "2020", "2021"]
    defaults: "2021"
  - id: month
    type: SELECT
    values: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    defaults: "01"
variables:
  file: "{{ inputs.taxi }}_tripdata_{{ inputs.year }}-{{ inputs.month }}.csv"
tasks:
  - id: filename
    type: io.kestra.plugin.core.log.Log
    message: "{{ render(vars.file) }}"
  - id: ingest
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - python3 /opt/module/ingest.py --taxi {{ inputs.taxi }} --year {{ inputs.year }} --month {{ inputs.month }}
