id: backfill_2021
namespace: zoomcamp.module2
description: Sequential January–July backfill for both taxi types.
tasks:
  - id: months
    type: io.kestra.plugin.core.flow.ForEach
    values: '["01", "02", "03", "04", "05", "06", "07"]'
    concurrencyLimit: 1
    tasks:
      - id: green
        type: io.kestra.plugin.core.flow.Subflow
        namespace: zoomcamp.module2
        flowId: taxi_month
        wait: true
        transmitFailed: true
        inputs:
          taxi: green
          year: "2021"
          month: "{{ taskrun.value }}"
      - id: yellow
        type: io.kestra.plugin.core.flow.Subflow
        namespace: zoomcamp.module2
        flowId: taxi_month
        wait: true
        transmitFailed: true
        inputs:
          taxi: yellow
          year: "2021"
          month: "{{ taskrun.value }}"
